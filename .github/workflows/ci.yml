name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install system OCR dependencies
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-rus poppler-utils

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --extra dev pytest -q

  apple-vision-smoke:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Record runtime conditions
        run: |
          sw_vers
          uname -m
          uv --version

      - name: Run real local Apple Vision smoke
        env:
          OCR_APPLE_VISION_SMOKE: "1"
        run: uv run --extra dev --extra pdf --extra apple-vision pytest tests/test_apple_vision_smoke.py -v -s
