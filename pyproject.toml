[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pro-ledin-ocr"
version = "0.6.0"
description = "Layered OCR and text-PDF table extraction for PDFs and images."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mxl" }]
keywords = ["ocr", "pdf", "tables", "camelot", "tesseract", "vision", "text-extraction", "cyrillic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing",
]
dependencies = ["camelot-py>=2,<3"]

[project.optional-dependencies]
vision = ["openai>=1.0"]
pdf = ["pymupdf"]
cv = ["opencv-python", "numpy"]
pytesseract = ["pytesseract"]
easyocr = ["easyocr"]
paddle = ["paddleocr>=3.7", "paddlepaddle>=3.2.1"]
paddle-vl = ["paddleocr[doc-parser]>=3.7", "paddlepaddle>=3.2.1"]
all = ["openai>=1.0", "pymupdf", "opencv-python", "numpy", "pytesseract", "easyocr", "paddleocr[doc-parser]>=3.7", "paddlepaddle>=3.2.1"]
dev = ["pytest>=8.0", "pillow", "reportlab"]

[project.scripts]
ocr = "pro.ledin.ocr.cli:main"
peepshow-sink-ocr = "pro.ledin.ocr.peepshow_sink:main"

[project.urls]
Homepage = "https://github.com/ledin-pro/ocr"
Repository = "https://github.com/ledin-pro/ocr"

[tool.hatch.build.targets.wheel]
packages = ["src/pro"]

[tool.hatch.build.targets.sdist]
include = [
    "src/pro",
    "tests",
    "skills/ocr/references",
    "skills/ocr/SKILL.md",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
